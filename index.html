<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Price Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1424;
    --surface: #161e33;
    --surface-2: #1d2742;
    --line: #2a3556;
    --text: #e8ecf7;
    --muted: #8d99b8;
    --accent: #7c9cff;
    --up: #2fd48a;
    --down: #ff5c70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { width: 100%; max-width: 980px; margin: 0 auto; padding: 40px 20px 24px; flex: 1; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .controls { display: flex; gap: 12px; margin-bottom: 20px; }
  .search {
    flex: 1; min-width: 0;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: inherit;
  }
  .search::placeholder { color: var(--muted); }
  button {
    background: var(--accent); color: #0e1424; border: 0; border-radius: 10px;
    padding: 12px 20px; font: inherit; font-weight: 800; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .search:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search:focus-visible { outline-offset: 0; }

  .status { color: var(--muted); font-size: .85rem; margin: 0 0 12px; min-height: 1.3em; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; }
  th, td { padding: 14px 16px; text-align: right; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; background: var(--surface-2); }
  th:nth-child(1), td:nth-child(1) { text-align: center; width: 48px; color: var(--muted); }
  th:nth-child(2), td:nth-child(2) { text-align: left; }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  .coin { display: flex; align-items: center; gap: 12px; }
  .coin img { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); }
  .coin strong { display: block; font-weight: 600; }
  .coin span { color: var(--muted); font-size: .8rem; text-transform: uppercase; }
  .up { color: var(--up); font-weight: 600; }
  .down { color: var(--down); font-weight: 600; }

  .skeleton td > div { height: 16px; border-radius: 6px; background: var(--surface-2); margin-left: auto; width: 70%; animation: pulse 1.2s ease-in-out infinite; }
  .skeleton td:nth-child(2) > div { margin-left: 0; width: 140px; }
  @keyframes pulse { 50% { opacity: .4; } }

  .message { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; text-align: center; }
  .message.error { border-color: var(--down); }
  .message p { margin: 0 0 14px; }
  .message p:last-child { margin: 0; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 20px; border-top: 1px solid var(--line); }
  footer a { color: var(--accent); }
  [hidden] { display: none !important; }

  /* Table becomes cards on small screens */
  @media (max-width: 640px) {
    main { padding-top: 28px; }
    .controls { flex-direction: column; }
    table, tbody, tr, td { display: block; width: 100%; }
    table { background: none; }
    thead { display: none; }
    tbody tr {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
    }
    tbody tr + tr td, tbody tr td { border: 0; }
    td { padding: 6px 0; display: flex; justify-content: space-between; align-items: center; text-align: right; }
    td:nth-child(1) { display: none; }
    td:nth-child(2) { padding-bottom: 10px; }
    td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: .85rem; font-weight: 400; }
    .skeleton td > div { width: 50%; }
    .skeleton td:nth-child(2) > div { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { .skeleton td > div { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Crypto Price Board</h1>
  <p class="sub">The top 10 coins by market cap, live from CoinGecko.</p>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search by name or symbol" aria-label="Search coins" autocomplete="off">
    <button id="refresh" type="button">Refresh</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="message error" id="error" hidden>
    <p id="error-text"></p>
    <button type="button" id="retry">Try again</button>
  </div>
  <div class="message" id="empty" hidden>
    <p id="empty-text">No coins match your search.</p>
  </div>

  <table id="table">
    <thead>
      <tr><th>#</th><th>Coin</th><th>Price (USD)</th><th>24h change</th><th>Market cap</th></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</main>

<footer>
  Not financial advice. Prices are for information only and may be delayed. Data from
  <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko</a>.
</footer>

<script>
  const API = "https://api.coingecko.com/api/v3/coins/markets" +
    "?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false&price_change_percentage=24h";

  const els = {
    body: document.getElementById("body"),
    table: document.getElementById("table"),
    search: document.getElementById("search"),
    refresh: document.getElementById("refresh"),
    retry: document.getElementById("retry"),
    status: document.getElementById("status"),
    error: document.getElementById("error"),
    errorText: document.getElementById("error-text"),
    empty: document.getElementById("empty"),
  };

  let coins = [];

  const usd = (n) => {
    if (n == null) return "—";
    const digits = n >= 1 ? 2 : 6;
    return n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: digits });
  };
  const compact = (n) => n == null ? "—" :
    "$" + n.toLocaleString("en-US", { notation: "compact", maximumFractionDigits: 2 });

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    children.forEach((c) => node.append(c));
    return node;
  }

  function cell(label, content, className) {
    const td = el("td", className ? { className } : {});
    td.dataset.label = label;
    td.append(content);
    return td;
  }

  function showSkeleton() {
    els.body.replaceChildren();
    for (let i = 0; i < 10; i++) {
      const tr = el("tr", { className: "skeleton" });
      for (let c = 0; c < 5; c++) tr.append(el("td", {}, el("div")));
      els.body.append(tr);
    }
  }

  function render() {
    const q = els.search.value.trim().toLowerCase();
    const list = coins.filter((c) => c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q));
    els.body.replaceChildren();
    els.empty.hidden = list.length > 0 || coins.length === 0;
    els.table.hidden = list.length === 0;

    list.forEach((c) => {
      const change = c.price_change_percentage_24h;
      const dir = change == null ? "" : change >= 0 ? "up" : "down";
      const arrow = change == null ? "" : change >= 0 ? "▲ " : "▼ ";
      const pct = change == null ? "—" : arrow + Math.abs(change).toFixed(2) + "%";

      const logo = el("img", { src: c.image, alt: "", loading: "lazy", width: 32, height: 32 });
      const name = el("div", {}, el("strong", { textContent: c.name }), el("span", { textContent: c.symbol }));
      const tr = el("tr");
      tr.append(
        el("td", { textContent: c.market_cap_rank }),
        el("td", {}, el("div", { className: "coin" }, logo, name)),
        cell("Price", usd(c.current_price)),
        cell("24h change", pct, dir),
        cell("Market cap", compact(c.market_cap))
      );
      els.body.append(tr);
    });
  }

  async function load() {
    els.error.hidden = true;
    els.empty.hidden = true;
    els.table.hidden = false;
    els.refresh.disabled = true;
    els.refresh.textContent = "Refreshing…";
    els.status.textContent = "Loading prices…";
    showSkeleton();

    try {
      const res = await fetch(API, { headers: { Accept: "application/json" } });
      if (res.status === 429) throw new Error("CoinGecko's free API is rate-limiting requests. Wait a minute, then try again.");
      if (!res.ok) throw new Error("CoinGecko returned an error (" + res.status + "). Try again in a moment.");
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Unexpected response from CoinGecko.");
      coins = data;
      render();
      els.status.textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      coins = [];
      els.body.replaceChildren();
      els.table.hidden = true;
      els.error.hidden = false;
      els.errorText.textContent = err instanceof TypeError
        ? "Couldn’t reach CoinGecko. Check your internet connection and try again."
        : err.message;
      els.status.textContent = "";
    } finally {
      els.refresh.disabled = false;
      els.refresh.textContent = "Refresh";
    }
  }

  els.search.addEventListener("input", render);
  els.refresh.addEventListener("click", load);
  els.retry.addEventListener("click", load);
  load();
</script>
</body>
</html>
